[project]
name = "canones-weather"
version = "0.1.0"
description = "Ecowitt gateway diagnostics and weather station operations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
canones-weather = "canones_weather.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]
station = [
    "boto3>=1.44.3",
    "weewx==5.5.2",
]

[tool.uv]
cache-dir = "tmp/.uv_cache"

[tool.pytest.ini_options]
cache_dir = "tmp/.pytest_cache"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
