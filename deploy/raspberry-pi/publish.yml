---
- name: Configure bucket-scoped pilot publishing
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Validate publisher destination
      ansible.builtin.assert:
        that:
          - weather_publisher.bucket == 'canones-weather'
          - weather_publisher.endpoint_url is match('^https://[a-f0-9]+\.r2\.cloudflarestorage\.com$')
          - weather_publisher.key_prefix == 'canones/'
          - weather_publisher_credentials_file is defined
    - name: Create publisher configuration directory
      ansible.builtin.file:
        path: /etc/canones-weather
        state: directory
        owner: root
        group: canones-weather
        mode: '0750'
    - name: Install bucket-scoped publisher credentials
      ansible.builtin.copy:
        src: "{{ weather_publisher_credentials_file }}"
        dest: /etc/canones-weather/r2.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Install public destination settings
      ansible.builtin.copy:
        content: "{{ weather_publisher | combine({'source_root': '/var/lib/canones-weather/pilot/public'}) | to_nice_json }}\n"
        dest: /etc/canones-weather/publisher.json
        owner: root
        group: canones-weather
        mode: '0640'
    - name: Install publisher systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - canones-weather-publish.service
        - canones-weather-publish.timer
    - name: Enable scheduled publishing
      ansible.builtin.systemd_service:
        name: canones-weather-publish.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Publish the current observation pair
      ansible.builtin.systemd_service:
        name: canones-weather-publish.service
        state: started
